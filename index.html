<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-dark text-white">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-black px-4">
    <a class="navbar-brand text-danger" href="#">NETFLIX</a>
    <ul class="navbar-nav ms-3">
      <li class="nav-item"><a class="nav-link active" href="#">TV Shows</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Movies</a></li>
      <li class="nav-item"><a class="nav-link" href="#">New & Popular</a></li>
      <li class="nav-item"><a class="nav-link" href="#">My List</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <div class="position-relative text-white">
    <img src="assets/partnerTrack.png" class="w-100" style="max-height: 70vh; object-fit: cover;" />
    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-end p-5 bg-gradient">
      <h1 class="display-4">Partner Track</h1>
      <p>At an elite NYC law firm, Ingrid Yun fights to make partner — and hold onto her principles — while balancing romance, friends and family expectations.</p>
      <div>
        <button class="btn btn-light me-2">▶ Play</button>
        <button class="btn btn-secondary">ℹ More Info</button>
      </div>
    </div>
  </div>

  <!-- My List Section -->
  <div class="container mt-4">
    <h3>My List</h3>
    <div class="row flex-nowrap overflow-auto">
      <div class="col-3">
        <img src="assets/cobrakai.jpg" class="img-fluid rounded" />
      </div>
      <div class="col-3">
        <img src="assets/outlander.jpg" class="img-fluid rounded" />
      </div>
      <!-- Ajoute plus d'images -->
    </div>
  </div>

  <!-- TV Dramas Section -->
  <div class="container mt-4">
    <h3>TV Dramas</h3>
    <div class="row flex-nowrap overflow-auto">
      <div class="col-3">
        <img src="assets/devil-ohio.jpg" class="img-fluid rounded" />
      </div>
      <div class="col-3">
        <img src="assets/the-crown.jpg" class="img-fluid rounded" />
      </div>
      <!-- Ajoute plus d'images -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
